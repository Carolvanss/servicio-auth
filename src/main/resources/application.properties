spring.application.name=servicio-auth
server.port=8080

# Conexión a MySQL: base de datos del proyecto PequeGestión
spring.datasource.url=jdbc:mysql://localhost:3306/pequegestion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota

# Hibernate crea o actualiza la tabla "usuarios" automáticamente
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que se ejecuta
spring.jpa.show-sql=true

# Archivo opcional con usuario y contraseña de MySQL (no se sube a GitHub)
spring.config.import=optional:classpath:application-local.properties